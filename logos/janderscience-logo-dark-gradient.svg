<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -16 306 352" width="100%" height="100%">
  <defs>
    <!-- Gradiente Oficial do Texto Janderscience (Branco -> Mint -> Sky Blue) -->
    <linearGradient id="jsGlowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Gradiente de Borda -->
    <linearGradient id="jsBorderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Hexágono Losango com Fundo Escuro e Borda Gradiente -->
  <polygon id="hexagon" fill="#090d16" stroke="url(#jsBorderGradient)" stroke-width="6" stroke-linejoin="round" points="139,0 278,80 278,240 139,320 0,240 0,80" />

  <!-- Monograma JS Preenchido com o Gradiente Luminoso -->
  <g id="js-monogram" fill="url(#jsGlowGradient)">
    <!-- Roof / Chevron -->
    <polygon id="roof" points="139,34 247,97 247,142 218,129 217,114 139,69 30,129 31,97" />

    <!-- Stylized J -->
    <polygon id="letter-j" points="121,105 121,271 31,218 31,166 59,151 59,199 94,218 94,120" />

    <!-- Stylized S -->
    <polygon id="letter-s" points="156,105 188,120 189,134 247,171 247,218 156,271 156,180 188,194 188,218 217,199 216,186 156,152" />
  </g>
</svg>
